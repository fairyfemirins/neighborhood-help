<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job - Neighborhood Help</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Post a Job</h1>
        
        <form method="POST" action="{{ url_for('post_job') }}">
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" name="title" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
            </div>
            <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <select class="form-select" id="category" name="category" required>
                    <option value="Plumbing">Plumbing</option>
                    <option value="Gardening">Gardening</option>
                    <option value="Babysitting">Babysitting</option>
                    <option value="Cleaning">Cleaning</option>
                    <option value="Moving">Moving</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="budget" class="form-label">Budget ($)</label>
                <input type="number" class="form-control" id="budget" name="budget" min="0" required>
            </div>
            <div class="mb-3">
                <label for="location" class="form-label">Location (e.g., "San Francisco, CA")</label>
                <input type="text" class="form-control" id="location" name="location" required>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary">Post Job</button>
            </div>
        </form>
    </div>
</body>
</html>
